# MINIMAL - GUARANTEED WORKING SERVERS
strategy: "specific"

servers:
  # TESTED - CONFIRMED WORKING
  - biocontext-ai/knowledgebase-mcp  # ✅ Tested - 20+ tools (proteins, literature, clinical trials, etc.)

  # REMOTE SERVERS (no build, just proxy - guaranteed to work)
  - longevity-genie/biothings-mcp      # Remote: MyGene, MyVariant, MyChem APIs
  - longevity-genie/gget-mcp           # Remote: gget bioinformatics tools
  - longevity-genie/opengenes-mcp      # Remote: OpenGenes database
  - longevity-genie/synergy-age-mcp    # Remote: SynergyAge database
  - meringlab/string-mcp               # Remote: STRING protein interactions
  - saezlab/omnipath-next              # Remote: Omnipath signaling database

  # VERIFIED PYTHON PACKAGES (these exist in PyPI)
  - biocontext-ai/anndata-mcp          # AnnData single-cell analysis
  - biocontext-ai/unofficial-cellosaurus-mcp  # Cellosaurus cell lines
  - PDBeurope/PDBe-MCP-Servers         # Protein Data Bank Europe
  - galaxyproject/galaxy-mcp           # Galaxy workflows
  - cyanheads/clinicaltrialsgov-mcp-server  # Clinical trials (bunx)
  - longevity-genie/pharmacology-mcp   # Guide to PHARMACOLOGY

categories: []
tags: []

prefer_remote: true
include_remote_only: true

resource_limits:
  default:
    cpu: "1.0"
    memory: "1G"

max_servers: 0  # 0 = unlimited

port_range:
  start: 8000
  end: 8099

env_vars:
  LOG_LEVEL: "info"
  MCP_ENVIRONMENT: "PRODUCTION"

advanced:
  check_updates_on_startup: true
  rebuild_on_change: true
  enable_health_checks: true
  health_check_interval: 30
  restart_policy: "unless-stopped"
  network_mode: "bridge"
